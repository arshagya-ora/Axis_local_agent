# Axis Phase 1.2 configuration. Loaded by axis/config.py from the project
# root by default; set AXIS_CONFIG_PATH to use a different file. Only
# non-secret settings belong here — credentials/tokens stay in environment
# variables (see .env.example) and are never read from this file.

browser:
  # AXIS has whole-browser access by default (see the Browser Agent Bridge's
  # own unscopedTabAccess policy flag) — this must stay true; Phase 1.2 does
  # not restore tab-group-only binding.
  whole_browser_access: true
  # Which tab bind_axis_run_deps() treats as the initial/informational one.
  # "focused" = Chrome's currently active tab; not an access restriction —
  # every other ordinary tab remains reachable via browser_tabs.
  initial_tab: focused
  max_open_tabs: 30
  allow_response_body: false
  # Recorded for forward-compatibility only: no tool schema in this layer
  # accepts coordinates, so this has no effect yet (see browser_agent_tools.py).
  allow_coordinate_fallback: false

  firewall:
    default: allow
    allow_urls:
      - "*"
      # Explicit, narrow exception: chrome:// pages are blocked below via
      # deny_schemes as a safe default (they can expose settings, saved
      # passwords, extension internals, etc.), but the blank new-tab page is
      # inert and was confirmed fine to use — these two patterns (Chrome
      # renamed the page between versions) are the only chrome:// URLs this
      # opens back up. A blanket "*" allow_urls entry never overrides
      # deny_schemes; only an explicit same-scheme pattern like these does.
      - "chrome://newtab/*"
      - "chrome://new-tab-page/*"
    deny_urls: []
    deny_schemes:
      - "chrome"
      - "chrome-extension"
      - "devtools"
      - "javascript"
    allow_methods:
      - "*"
    deny_methods:
      - "cookies.get"
      - "page.executeJavaScript"
      - "policy.set"
      - "extension.reload"

limits:
  max_requests: 600
  max_tool_calls: 1200
  max_total_tokens: 50000000
  max_wall_clock_seconds: 900
  max_retries: 3

cli:
  trace: verbose
  show_model_text: true
  show_tool_arguments: true
  show_tool_results: true
  show_usage: true
  redact_sensitive_values: true
