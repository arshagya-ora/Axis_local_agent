# AXIS configuration — the single file that defines every configurable value
# for the planner/navigator agent. Read once, by axis.models.AxisConfig.load();
# there is no configuration framework and nothing else parses this file.

browser:
  # AXIS has whole-browser access by default (see the Browser Agent Bridge's
  # own unscopedTabAccess policy flag) — this must stay true; Phase 1.2 does
  # not restore tab-group-only binding.
  whole_browser_access: true
  # Which tab the orchestrator binds to on its first browser step.
  # "focused" = Chrome's currently active tab; not an access restriction —
  # every other ordinary tab remains reachable via browser_tabs.
  initial_tab: focused
  # Under whole_browser_access every pre-existing tab is registered on the
  # first tabs.list, before AXIS opens anything of its own — this cap has to
  # comfortably exceed your normal open-tab count, not just what AXIS itself
  # needs. Raise it if you regularly run with many tabs open.
  max_open_tabs: 60
  allow_response_body: false
  # Coordinate actions are available only during visual recovery and always
  # require the latest screenshot. Set false to allow visual reading only.
  allow_coordinate_fallback: true
  # Where browser_capture_evidence writes artifacts; null = the bridge default.
  artifact_directory: null
  # Directories locator uploads may read from. Empty = uploads are refused.
  upload_roots: []

  firewall:
    default: allow
    allow_urls:
      - "*"
      # Explicit, narrow exception: chrome:// pages are blocked below via
      # deny_schemes as a safe default (they can expose settings, saved
      # passwords, extension internals, etc.), but the blank new-tab page is
      # inert and was confirmed fine to use — these two patterns (Chrome
      # renamed the page between versions) are the only chrome:// URLs this
      # opens back up. A blanket "*" allow_urls entry never overrides
      # deny_schemes; only an explicit same-scheme pattern like these does.
      - "chrome://newtab/*"
      - "chrome://new-tab-page/*"
    deny_urls: []
    deny_schemes:
      - "chrome"
      - "chrome-extension"
      - "devtools"
      - "javascript"
    allow_methods:
      - "*"
    deny_methods:
      - "cookies.get"
      - "page.executeJavaScript"
      - "policy.set"
      - "extension.reload"

provider:
  # Credentials, endpoint, and model come from AXIS_OCI_* in the environment
  # (see provider_config.py / .env.example). These only override them.
  model: null
  base_url: null
  # OCI GenAI exposes an OpenAI-compatible Responses API.
  api: responses
  # Extra pydantic_ai ModelSettings applied to the shared model instance.
  settings: {}

run:
  # Planner cadence: one planner pass every N navigator steps, plus every
  # event listed in the orchestrator (goal reached, blocked, follow-up, ...).
  planner_interval_steps: 3
  # Extend successful execution up to this interval; set equal to the base
  # interval above for fixed planner cadence.
  planner_max_interval_steps: 6
  # Browser tool calls the navigator may make inside one navigator step.
  max_actions_per_step: 3
  max_total_steps: 30
  max_model_requests: 60
  max_browser_actions: 90
  max_consecutive_failures: 3
  # Observation taken programmatically before every navigator step.
  observation_mode: compact
  observation_max_nodes: 1000
  # Force images every step. Normally automatic recovery requests them only
  # when the DOM view is insufficient. Images are not persisted by default.
  include_screenshot: false
  visual_mode: auto
  tool_timeout_seconds: 120.0

tools:
  # The ordinary navigator set is browser_tabs / observe / act / navigate /
  # wait / assert. Specialist tools stay out of the hot-path schema.
  capture_evidence: false
  diagnose: false
  downloads: false
  # Internal bridge recording + RPC trace. Text and screenshots are excluded;
  # enable only for bounded failure investigation.
  debug_recording: false
  # Pydantic AI's ToolSearch capability. With six visible tools discovery
  # earns nothing, so it is off; turning it on hides the opt-in tools above
  # behind defer_loading=True so the navigator has to search for them.
  tool_search: false
  # Actions the orchestrator's approval callback is consulted for.
  approval_required_actions:
    - upload
    - drag

memory:
  max_recent_actions: 8
  max_completed_goals: 8
  max_followups: 5
  max_extracted_data: 16

# Where each Pydantic AI AgentSpec is defined (loaded with Agent.from_file);
# this file only points at them. Relative to this file's directory.
planner_spec_path: axis/planner_agent.yaml
navigator_spec_path: axis/navigator_agent.yaml
