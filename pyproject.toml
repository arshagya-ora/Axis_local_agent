[project]
name = "axis-agent"
version = "0.1.0"
description = "Axis: a typed Pydantic AI browser agent with whole-browser multi-tab control of the Browser Agent Bridge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned for the axis-agent Pydantic AI/OCI POC and Phase 0 compatibility
    # probe. See axis-agent/PHASE_0_BASELINE.md for the upgrade rule: bumping
    # any of these requires the browser contract tests to pass and a new
    # compatibility report to be compared against the previously accepted one.
    "httpx==0.28.1",
    "oci-openai==1.1.0",
    "oci==2.185.1",
    "openai==3.8.0",
    "pydantic==2.13.5",
    "pydantic-ai-slim[openai,temporal]==2.40.0",
    # Phase 2: Harness capabilities (Planning, ToolGuardrail, SystemReminders).
    # Newest release on PyPI at pin time; requires pydantic-ai-slim>=2.38.0,
    # satisfied by the pin above. Bumping this is subject to the same rule
    # as the pydantic-ai-slim pin (see the comment above).
    "pydantic-ai-harness==0.29.0",
    # Phase 3: Temporal durability backend. pydantic-ai-slim's `temporal`
    # extra requires temporalio>=1.24.0; newest release on PyPI at pin time,
    # with a win_amd64 wheel. Same upgrade rule as the pins above.
    "temporalio==1.32.0",
    "PyYAML==6.0.3",
    "pyside6==6.7.3",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]
