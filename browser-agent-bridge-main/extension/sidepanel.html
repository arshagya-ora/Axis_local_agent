<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AXIS workspace</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="workspace" class="app">
      <header class="toolbar">
        <div class="brand">
          <span class="axis-mark" aria-hidden="true"></span
          ><strong>AXIS</strong>
        </div>
        <nav aria-label="Workspace">
          <button
            id="history-button"
            class="icon-button"
            aria-label="Conversation history"
            data-icon="history"
          ></button
          ><button
            id="new-conversation"
            class="icon-button"
            aria-label="New conversation"
            data-icon="edit"
          ></button
          ><button
            id="settings-button"
            class="icon-button"
            aria-label="Settings"
            data-icon="settings"
          ></button>
        </nav>
      </header>
      <div class="conversation-heading">
        <h1 id="conversation-title">New conversation</h1>
        <div class="context-line">
          <span id="browser-context" class="tab-context"></span
          ><button
            id="connection-button"
            class="connection"
            aria-label="Connection details"
          >
            Service offline
          </button>
        </div>
        <div id="connection-details" class="notice" hidden></div>
      </div>
      <button id="return-active" class="active-strip" hidden>
        Return to active task <span aria-hidden="true">→</span>
      </button>
      <section
        id="approval-region"
        aria-label="Browser bridge approvals"
        hidden
      ></section>
      <section id="execution-approval" aria-label="Task action approval" aria-live="polite" hidden></section>
      <main id="conversation" tabindex="-1" aria-label="Conversation">
        <div id="timeline"></div>
      </main>
      <button id="new-activity" class="new-activity" hidden>
        ↓ New activity
      </button>
      <div class="composer-wrap">
        <div id="pending-instruction" class="notice" role="status" hidden>
          <p>Delivery of a previous instruction is unconfirmed.</p>
          <p id="pending-preview"></p>
          <button id="retry-instruction" type="button">Retry previous instruction</button>
        </div>
        <p id="workspace-error" class="feedback error" role="alert" hidden></p>
        <form id="composer" class="composer">
          <div id="attachment-composer"></div>
          <div id="context-chip" class="context-chip" hidden></div>
          <label class="sr-only" for="instruction">Instruction</label
          ><textarea
            id="instruction"
            rows="2"
            maxlength="4000"
            placeholder="Ask or add an instruction…"
          ></textarea>
          <div class="composer-controls">
            <div id="attachment-action"></div>
            <label class="sr-only" for="execution-mode">Execution mode</label>
            <select id="execution-mode" title="Approval asks before website changes; Automatic acts within your request.">
              <option value="approval">Approval</option>
              <option value="automatic">Automatic</option>
            </select>
            <label class="sr-only" for="message-mode">Message target</label
            ><select id="message-mode">
              <option value="new_task">New task</option>
              <option value="follow_up">Current task</option></select
            ><button
              id="send"
              class="send-button"
              aria-label="Send instruction"
              type="submit"
              data-icon="send"
            ></button>
          </div>
        </form>
          <p id="composer-hint" class="composer-hint">
            Connect AXIS in Settings to start a browser task.
          </p>
      </div>
    </div>
    <section
      id="settings-view"
      class="settings-view"
      aria-label="Settings"
      hidden
    ></section>
    <dialog
      id="history-drawer"
      class="history-drawer"
      aria-labelledby="history-title"
    >
      <header class="toolbar">
        <div class="brand">
          <span class="axis-mark" aria-hidden="true"></span
          ><strong>AXIS</strong>
        </div>
        <button
          id="close-history"
          class="icon-button"
          aria-label="Close history"
          data-icon="close"
        ></button>
      </header>
      <div class="history-heading">
        <div class="row">
          <h1 id="history-title">Conversations</h1>
          <button
            id="history-new"
            class="icon-button outlined"
            aria-label="New conversation"
            data-icon="edit"
          ></button>
        </div>
        <label class="search"
          ><span data-icon="search"></span
          ><input
            id="history-search"
            type="search"
            placeholder="Search conversations…"
            aria-label="Search conversations"
        /></label>
      </div>
      <div id="history-list" class="history-list"></div>
      <footer class="history-footer">
        <span data-icon="monitor"></span>Local history
        <span class="muted">Saved on this computer</span>
      </footer>
    </dialog>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
